# Socket types found in homes, shops, etc.
#
# In some countries it is quite messy because they don't have an official
# standard. According to research (mostly from worldstandards.eu, see below),
# the use of universal sockets is quite wide-spread in such regions.
#
# Most sockets can be neatly categorized with the letter designations for
# generally compatible types of plugs maintained by the International
# Electrotechnical Commission (IEC). However, some types, such as type L and J,
# contain several plugs which are incompatible to each other. In this case,
# we rather use the national standard names.
#
# Sources:
# - https://wiki.openstreetmap.org/wiki/Key:socket:*
# - https://en.wikipedia.org/wiki/Mains_electricity_by_country
# - https://www.worldstandards.eu/electricity/plug-voltage-by-country/
#
# Synonyms:
# - schuko = typef
# - sev1011_* = sn41011_* = typej (but several distinct ones!)
# - as3112 = typei
# - nema_1_15 = typea
# - nema_5_15 = typeb
# - bs1363 = typeg
# - cei23_50_s_* = Typel (but several distinct ones!)
#
#
#
# Checked: September 2026.

