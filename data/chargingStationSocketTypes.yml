# Official charging station socket types for passenger cars by country.
# Only those either mandated or extremely common (i.e. it would
# constitute an exception if they are missing)
#
# Keys correspond to OSM socket:* values without the "socket:" prefix.
#
# Sources: https://www.evexpert.eu/eshop1/knowledge-center/connector-types-for-ev-charging-around-the-world
#          https://www.worldstandards.eu/cars/connector-types/
#          https://www.power-sonic.com/ev-charging-connector-types/
#
# QLever query to check which values are tagged per country:
# https://qlever.dev/osm-planet/?query=PREFIX+osmkey%3A+%3Chttps%3A%2F%2Fwww.openstreetmap.org%2Fwiki%2FKey%3A%3E%0APREFIX+osmrel%3A+%3Chttps%3A%2F%2Fwww.openstreetmap.org%2Frelation%2F%3E%0APREFIX+ogc%3A+%3Chttp%3A%2F%2Fwww.opengis.net%2Frdf%23%3E%0A%0APREFIX+osm%3A+%3Chttps%3A%2F%2Fwww.openstreetmap.org%2F%3E%0ASELECT+%3Fkey+%28COUNT%28%3Felement%29+AS+%3Fcount%29+WHERE+%7B%0A++%23+++++++++v---+Relation+ID+of+country+goes+here%21%0A++osmrel%3A49715+ogc%3AsfContains+%3Felement+.%0A++%3Felement+osmkey%3Aamenity+%22charging_station%22+.%0A++%3Felement+%3Fpredicate+%3Fvalue+.%0A++FILTER+NOT+EXISTS+%7B+%3Felement+osmkey%3Amotor_vehicle+%22no%22+%7D%0A++FILTER+NOT+EXISTS+%7B+%3Felement+osmkey%3Amotorcar+%22no%22+%7D%0A++BIND+%28STRAFTER%28STR%28%3Fpredicate%29%2C+%22https%3A%2F%2Fwww.openstreetmap.org%2Fwiki%2FKey%3A%22%29+AS+%3Fkey%29%0A++FILTER+%28REGEX%28STR%28%3Fkey%29%2C+%22%5Esocket%3A%5Ba-zA-Z_0-9%5D%2B%24%22%29%29%0A%7D%0AGROUP+BY+%3Fkey%0AORDER+BY+DESC%28%3Fcount%29

