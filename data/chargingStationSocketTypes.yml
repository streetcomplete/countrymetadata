# Russia: according to various news sources, there is a subsidy for charging
# stations only if it has as least one GB/T connector, that's a soft standard
RU: [type2_cable, type2, type2_combo, gb_dc]

# North America
# USA designated type1 + nacs as official standards
CA: [nacs, type1, type1_combo]
MX: [nacs, type1, type1_combo]
US: [nacs, type1, type1_combo]

# Asia
CN: [gb_ac, gb_dc]
HK: [gb_ac, gb_dc]
MO: [gb_ac, gb_dc]
JP: [type1, nacs, chademo]
